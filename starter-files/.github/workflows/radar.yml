name: GitHub profile search (starter template)

on:
  schedule:
    - cron: "7 1,9,13,17 * * *"
      timezone: "REPLACE_WITH_TIMEZONE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run search
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python radar.py

      - name: Save results
        if: always()
        run: |
          git config user.name "search-bot"
          git config user.email "search-bot@users.noreply.github.com"
          git add profiles.csv state.json
          git diff --cached --quiet || git commit -m "Update search results"
          git pull --rebase
          git push
